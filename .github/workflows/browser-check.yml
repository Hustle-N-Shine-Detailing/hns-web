name: Browser checks

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'admin/**'
      - 'ops/**'
      - 'trade-partners/**'
      - 'fleet-detailing/**'
      - 'dealer-detailing/**'
      - 'body-shop-detailing/**'
      - 'commercial-detailing/**'
      - 'tests/browser-e2e.mjs'
      - '.github/workflows/browser-check.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hns-http.log 2>&1 &
          echo $! > /tmp/hns-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hns-http.log
          exit 1

      - name: Run browser checks
        run: node tests/browser-e2e.mjs
