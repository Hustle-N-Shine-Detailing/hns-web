name: Project checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run project smoke tests
        run: npm test

      - name: Parse Supabase Edge Function
        run: npm run check:edge

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
