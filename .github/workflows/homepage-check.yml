name: Project checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run project smoke tests
        run: npm test

      - name: Check public-site performance budgets
        run: npm run test:performance

      - name: Parse Supabase Edge Function
        run: npm run check:edge

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
