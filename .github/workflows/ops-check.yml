name: Ops checks

on:
  pull_request:
    paths:
      - 'ops/**'
      - '.github/workflows/ops-check.yml'
  push:
    branches:
      - main
      - feature/detailer-ops-mvp
    paths:
      - 'ops/**'
      - '.github/workflows/ops-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check every Ops JavaScript file
        run: |
          set -euo pipefail
          for file in ops/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Confirm required Ops files
        run: |
          test -f ops/index.html
          test -f ops/app.css
          test -f ops/app.js
          test -f ops/job-tools.js
          test -f ops/growth-tools.js
          test -f ops/estimate-tools.js
          test -f ops/pricing-tools.js
          test -f ops/direct-job-tools.js
          test -f ops/runtime-guards.js
          test -f ops/lead-finder-tools.js
          test -f ops/campaign-tools.js
