<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hustle &amp; Shine Detailing Co. | Mobile Detailing — Boise &amp; Treasure Valley</title>
<meta name="description" content="Mobile detailing for cars, trucks, fleets and powersports across Boise, Meridian, Eagle, Star, Nampa, and Caldwell. Book online, pay online. Call or text (208) 977-1200.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0A0B'/%3E%3Ctext x='50' y='72' font-family='Arial Black,sans-serif' font-weight='900' font-size='62' fill='%23F5820B' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0B;
    --panel:#141415;
    --panel-2:#1C1C1E;
    --panel-3:#232326;
    --white:#F4F1ED;
    --flame:#F5820B;
    --flame-hi:#FFA033;
    --ember:#C4290F;
    --ember-hi:#E8442A;
    --gold:#FFB627;
    --steel:#8B8580;
    --line:rgba(244,241,237,0.11);
    --line-2:rgba(244,241,237,0.2);

    --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --s6:92px;
    --max:1100px;
    --chamf: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; }
  img,svg{ display:block; max-width:100%; }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; margin:0; padding:0; }
  h1,h2,h3,h4,p{ margin:0; }
  button{ font:inherit; }

  body{
    background:var(--black);
    color:var(--white);
    font-family:'Barlow', system-ui, sans-serif;
    font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.005em; line-height:0.92; }
  .cond{ font-family:'Barlow Condensed', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .mono{ font-family:'Space Mono', monospace; }
  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--flame);
  }
  .eyebrow::before{ content:""; width:24px; height:2px; background:var(--ember); flex:none; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 var(--s3); }
  .skip-link{ position:absolute; left:-9999px; top:0; background:var(--flame); color:var(--black); padding:10px 16px; z-index:200; font-weight:700; }
  .skip-link:focus{ left:0; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .hazard{ height:9px; background:repeating-linear-gradient(-45deg, var(--black) 0 13px, var(--flame) 13px 26px); }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 26px; cursor:pointer; border:1px solid transparent;
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:16px; letter-spacing:0.05em; text-transform:uppercase;
    clip-path:var(--chamf);
    transition:filter .15s ease, transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.1); }
  .btn-flame{ background:var(--flame); color:#180A00; }
  .btn-ember{ background:var(--ember); color:var(--white); }
  .btn-ghost{ background:transparent; border-color:var(--line-2); color:var(--white); }
  .btn-ghost:hover{ border-color:var(--flame); color:var(--flame); }
  .btn-sm{ padding:10px 18px; font-size:14px; clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); }
  .btn[disabled]{ opacity:.35; cursor:not-allowed; transform:none; filter:none; }

  /* Header */
  header{ position:sticky; top:0; z-index:100; background:rgba(10,10,11,0.9); backdrop-filter:blur(12px); border-bottom:1px solid transparent; transition:border-color .2s ease; }
  header.scrolled{ border-bottom-color:var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:var(--max); margin:0 auto; padding:14px var(--s3); }
  .brand{ display:flex; flex-direction:column; line-height:1.05; }
  .brand-name{ font-family:'Anton',sans-serif; font-size:21px; text-transform:uppercase; letter-spacing:0.01em; }
  .brand-name span{ color:var(--flame); }
  .brand-sub{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.08em; color:var(--steel); text-transform:uppercase; margin-top:3px; }
  .nav-actions{ display:flex; align-items:center; gap:10px; }
  .nav-phone{ display:none; font-family:'Space Mono',monospace; font-size:13.5px; color:var(--steel); }
  .nav-phone:hover{ color:var(--white); }
  @media(min-width:680px){ .nav-phone{ display:inline-flex; } }

  /* Hero */
  .hero{ padding:var(--s5) 0 var(--s4); position:relative; overflow:hidden; }
  .hero::before{
    content:""; position:absolute; top:-25%; left:50%; transform:translateX(-50%);
    width:130%; height:560px;
    background:radial-gradient(ellipse at center, rgba(196,41,15,0.28), rgba(245,130,11,0.08) 40%, transparent 68%);
    pointer-events:none;
  }
  .hero-inner{ position:relative; }
  .hero-logo{ width:100%; max-width:440px; height:auto; margin:0 0 var(--s4); border:1px solid var(--line); }
  .hero h1{ font-size:clamp(42px,9vw,80px); margin-top:16px; max-width:16ch; }
  .hero h1 em{ font-style:normal; color:var(--flame); }
  .hero p.lede{ margin-top:var(--s2); font-size:clamp(16px,2.2vw,18.5px); color:#CFC9C2; max-width:54ch; }
  .hero-ctas{ display:flex; flex-wrap:wrap; gap:12px; margin-top:var(--s3); }

  /* Strip */
  .strip{ border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--panel); }
  .strip-inner{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s2) var(--s3); padding:var(--s2) 0; }
  .areas{ display:flex; flex-wrap:wrap; gap:8px; }
  .areas li{ font-family:'Space Mono',monospace; font-size:12px; color:var(--steel); border:1px solid var(--line); padding:5px 12px; }
  .hours{ font-family:'Space Mono',monospace; font-size:12.5px; color:var(--steel); }
  .hours strong{ color:var(--white); }

  section{ padding:var(--s5) 0; }
  .section-head{ max-width:60ch; margin-bottom:var(--s4); }
  .section-head h2{ font-size:clamp(30px,5vw,48px); margin-top:14px; }
  .section-head p{ margin-top:14px; color:var(--steel); }

  /* ---- BOOKING APP ---- */
  .app{ border:1px solid var(--line); background:var(--panel); }
  .app-top{ border-bottom:1px solid var(--line); padding:var(--s3); }
  .progress{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pnode{ display:flex; align-items:center; gap:9px; }
  .pdot{
    width:28px; height:28px; flex:none; display:grid; place-items:center;
    font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
    background:var(--panel-3); color:var(--steel); border:1px solid var(--line-2);
  }
  .plabel{ font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; font-size:14px; color:var(--steel); }
  .pnode.done .pdot{ background:var(--ember); color:var(--white); border-color:var(--ember); }
  .pnode.done .plabel{ color:#CFC9C2; }
  .pnode.current .pdot{ background:var(--flame); color:#180A00; border-color:var(--flame); }
  .pnode.current .plabel{ color:var(--white); }
  .pbar{ flex:1 1 20px; min-width:14px; height:2px; background:var(--line-2); }

  .app-body{ padding:var(--s3); }
  .step-title{ font-family:'Space Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--flame); margin-bottom:var(--s2); }

  .opt-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:760px){ .opt-grid{ grid-template-columns:repeat(4,1fr); } }
  .opt{
    text-align:left; cursor:pointer; background:var(--panel-2); color:var(--white);
    border:1px solid var(--line-2); border-left:3px solid var(--line-2);
    padding:16px; transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .opt:hover{ border-color:var(--flame); transform:translateY(-2px); }
  .opt.sel{ border-color:var(--flame); border-left-color:var(--flame); background:rgba(245,130,11,0.10); }
  .opt-name{ display:block; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; font-size:16.5px; line-height:1.15; }
  .opt-sub{ display:block; font-family:'Space Mono',monospace; font-size:10.5px; line-height:1.45; color:var(--steel); margin-top:7px; }

  .pkg-list{ display:flex; flex-direction:column; gap:10px; }
  .pkg-opt{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px var(--s3);
    background:var(--panel-2); border:1px solid var(--line-2); border-left:3px solid var(--line-2);
    padding:18px; cursor:pointer; text-align:left; color:var(--white); width:100%;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .pkg-opt:hover{ border-color:var(--flame); transform:translateY(-2px); }
  .pkg-opt.sel{ border-color:var(--flame); border-left-color:var(--flame); background:rgba(245,130,11,0.10); }
  .pkg-opt > span:first-child{ flex:1 1 260px; min-width:0; }
  .pkg-opt h3{ font-family:'Anton',sans-serif; font-size:21px; text-transform:uppercase; display:block; }
  .pkg-opt p{ color:var(--steel); font-size:14px; margin-top:6px; max-width:46ch; }
  .pkg-price{ font-family:'Anton',sans-serif; font-size:28px; color:var(--flame); letter-spacing:0.01em; }
  .pkg-price small{ display:block; font-family:'Space Mono',monospace; font-size:10.5px; color:var(--steel); letter-spacing:0.06em; }

  .summary{ background:var(--panel-2); border:1px solid var(--line-2); border-top:3px solid var(--flame); padding:var(--s3); }
  .sum-row{ display:flex; justify-content:space-between; gap:var(--s2); padding:11px 0; border-bottom:1px solid var(--line); }
  .sum-row:last-of-type{ border-bottom:0; }
  .sum-k{ font-family:'Space Mono',monospace; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel); }
  .sum-v{ font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:17px; letter-spacing:0.02em; text-align:right; }
  .sum-total{ display:flex; justify-content:space-between; align-items:baseline; gap:var(--s2); margin-top:var(--s2); padding-top:var(--s2); border-top:2px solid var(--flame); }
  .sum-total .sum-k{ font-size:12.5px; color:var(--white); }
  .sum-amt{ font-family:'Anton',sans-serif; font-size:38px; color:var(--flame); line-height:1; }
  .sum-note{ font-size:13px; color:var(--steel); margin-top:var(--s2); }
  .sum-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:var(--s3); }
  .sum-actions .btn{ flex:1 1 190px; }

  .app-nav{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--line); }

  /* Specialty */
  .cards{ display:grid; grid-template-columns:1fr; gap:var(--s2); }
  @media(min-width:760px){ .cards{ grid-template-columns:repeat(3,1fr); } }
  .card{ background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--ember); padding:var(--s3); transition:transform .18s ease, border-color .18s ease; }
  .card:hover{ transform:translateY(-3px); border-top-color:var(--flame); }
  .card h3{ font-family:'Anton',sans-serif; font-size:21px; text-transform:uppercase; }
  .card p{ color:var(--steel); font-size:14px; margin-top:8px; }
  .tag{ display:inline-block; margin-top:var(--s2); font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); border:1px solid rgba(255,182,39,.4); padding:5px 10px; }
  .card-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:var(--s3); }

  /* Fleet */
  .fleet{
    border:1px solid var(--line); border-left:4px solid var(--flame);
    background:linear-gradient(135deg, rgba(196,41,15,0.2), rgba(245,130,11,0.05) 55%, transparent);
    padding:var(--s4); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s3);
  }
  .fleet h2{ font-family:'Anton',sans-serif; font-size:clamp(26px,4vw,38px); text-transform:uppercase; max-width:19ch; margin-top:12px; line-height:0.95; }
  .fleet p{ color:#CFC9C2; margin-top:12px; max-width:50ch; font-size:15px; }
  .fleet-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* Steps */
  .steps{ display:grid; grid-template-columns:1fr; gap:var(--s3); }
  @media(min-width:760px){ .steps{ grid-template-columns:repeat(3,1fr); } }
  .stepc{ border-top:2px solid var(--line); padding-top:var(--s2); }
  .stepc .n{ font-family:'Anton',sans-serif; font-size:42px; color:var(--ember); line-height:1; }
  .stepc h3{ font-family:'Anton',sans-serif; font-size:21px; text-transform:uppercase; margin-top:8px; }
  .stepc p{ color:var(--steel); font-size:14px; margin-top:8px; max-width:34ch; }

  /* Review */
  .review{ text-align:center; }
  .review .eyebrow{ justify-content:center; }
  .review h2{ font-size:clamp(26px,4vw,40px); margin-top:12px; }
  .review p{ color:var(--steel); margin-top:12px; max-width:44ch; margin-inline:auto; }
  .review .btn{ margin-top:var(--s3); }

  /* Footer */
  footer{ border-top:1px solid var(--line); padding:var(--s4) 0 var(--s3); }
  .foot{ display:grid; grid-template-columns:1fr; gap:var(--s4); }
  @media(min-width:720px){ .foot{ grid-template-columns:1.4fr 1fr 1fr; } }
  footer h4{ font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--steel); margin-bottom:14px; }
  .foot-links a{ display:block; font-size:15px; margin-bottom:8px; }
  .foot-links a:hover{ color:var(--flame); }
  .foot-areas li{ font-size:14.5px; color:var(--steel); margin-bottom:6px; }
  .foot-bottom{ margin-top:var(--s4); padding-top:var(--s2); border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:var(--s2) var(--s3); justify-content:space-between; font-family:'Space Mono',monospace; font-size:12px; color:var(--steel); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ transition:none !important; }
  }
</style>
</head>
